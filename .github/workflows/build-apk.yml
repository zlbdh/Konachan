name: 构建 Debug APK

'on':
  push:
    branches: [master]
    paths-ignore: [latest_version.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: konachan-release-master
      cancel-in-progress: false
    steps:
      - name: 拉取代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          dependency-graph: disabled

      - name: 确认 Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: 构建 APK
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: 使用项目固定签名并验证 APK
        id: signed
        env:
          KEYSTORE_B64: ${{ secrets.KONACHAN_SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.KONACHAN_SIGNING_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.KONACHAN_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$SIGNING_PASSWORD"
          test -n "$SIGNING_CERT_SHA256"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/konachan-signing.p12"
          chmod 600 "$RUNNER_TEMP/konachan-signing.p12"
          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          APK_FILE="${apks[0]}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/konachan-signing.p12" --ks-type PKCS12 --ks-key-alias konachan \
            --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD \
            --out "$RUNNER_TEMP/konachan-signed.apk" "$APK_FILE"
          mv "$RUNNER_TEMP/konachan-signed.apk" "$APK_FILE"
          python3 .github/scripts/signing_metadata.py --apk "$APK_FILE" --sdk "$ANDROID_HOME" \
            --expected-certificate "$SIGNING_CERT_SHA256"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK_FILE"
          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: 清理临时签名材料
        if: always()
        run: rm -f -- "$RUNNER_TEMP/konachan-signing.p12"

      - name: 上传 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: konachan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          archive: true

      - name: 发布 Release 并更新版本文件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.signed.outputs.apk_path }}
        run: |
          python3 .github/scripts/publish_release.py --apk "$APK_PATH" \
            --source-sha "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER"
